name = "secure"
description = "설계 토론 → 구현 → 리뷰 + 보안 리뷰 → 승인 뒤 보안 감사"

[roles.claude]
agent = "claude"

[roles.codex]
agent = "codex"

[roles.security]
agent = "codex"
templates = { review = "review_security" }

[roles.auditor]
agent = "claude"

[[steps]]
kind = "debate"
proposers = ["claude", "codex"]
synth = "codex"

[[steps]]
kind = "build"
implementer = "claude"
reviewers = ["codex", "security"]

[[steps]]
kind = "audit"
roles = ["auditor"]
